<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <style>
      .mono { font-family: 'Sarasa Mono TC', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>

  <!-- 遠景網格線 -->
  <g stroke="#334155" stroke-width="1" opacity="0.35">
    <line x1="0" y1="220" x2="1280" y2="220"/>
    <line x1="0" y1="300" x2="1280" y2="300"/>
    <line x1="0" y1="380" x2="1280" y2="380"/>
    <line x1="0" y1="460" x2="1280" y2="460"/>
    <line x1="0" y1="540" x2="1280" y2="540"/>
  </g>

  <!-- 體素平台區段 1 & 2 (x = 12..18, 顯示於畫面左側 x=80..560) -->
  <g transform="translate(80, 480)">
    <g>
      <rect x="0" y="0" width="76" height="52" rx="4" fill="#4B5563" stroke="#1F2937" stroke-width="2"/>
      <rect x="0" y="-10" width="76" height="12" rx="2" fill="#6B7280"/>
    </g>
    <g transform="translate(80,0)">
      <rect x="0" y="0" width="76" height="52" rx="4" fill="#374151" stroke="#1F2937" stroke-width="2"/>
      <rect x="0" y="-10" width="76" height="12" rx="2" fill="#4B5563"/>
    </g>
    <g transform="translate(160,0)">
      <rect x="0" y="0" width="76" height="52" rx="4" fill="#4B5563" stroke="#1F2937" stroke-width="2"/>
      <rect x="0" y="-10" width="76" height="12" rx="2" fill="#6B7280"/>
    </g>
    <g transform="translate(240,0)">
      <rect x="0" y="0" width="76" height="52" rx="4" fill="#374151" stroke="#1F2937" stroke-width="2"/>
      <rect x="0" y="-10" width="76" height="12" rx="2" fill="#4B5563"/>
    </g>
    <g transform="translate(320,0)">
      <rect x="0" y="0" width="76" height="52" rx="4" fill="#4B5563" stroke="#1F2937" stroke-width="2"/>
      <rect x="0" y="-10" width="76" height="12" rx="2" fill="#6B7280"/>
    </g>
    <g transform="translate(400,0)">
      <rect x="0" y="0" width="76" height="52" rx="4" fill="#374151" stroke="#1F2937" stroke-width="2"/>
      <rect x="0" y="-10" width="76" height="12" rx="2" fill="#4B5563"/>
    </g>
    <!-- 2 格寬缺口 (x = 19, 20 -> 像素 480..640) 標示 -->
    <rect x="482" y="10" width="152" height="70" fill="#090D16" stroke="#EF4444" stroke-dasharray="6 4" stroke-width="2" opacity="0.75"/>
    <text x="558" y="48" text-anchor="middle" fill="#FCA5A5" class="mono" font-size="13" font-weight="700">2 格缺口 (x=19..20)</text>
    <text x="558" y="68" text-anchor="middle" fill="#F87171" class="mono" font-size="12">需大步 (≥2.2s / 3格)</text>

    <!-- 平台區段 3 後半 (x = 21..25 -> 像素 640..1040) -->
    <g transform="translate(640,0)">
      <rect x="0" y="0" width="76" height="52" rx="4" fill="#374151" stroke="#1F2937" stroke-width="2"/>
      <rect x="0" y="-10" width="76" height="12" rx="2" fill="#4B5563"/>
    </g>
    <g transform="translate(720,0)">
      <rect x="0" y="0" width="76" height="52" rx="4" fill="#4B5563" stroke="#1F2937" stroke-width="2"/>
      <rect x="0" y="-10" width="76" height="12" rx="2" fill="#6B7280"/>
    </g>
    <g transform="translate(800,0)">
      <rect x="0" y="0" width="76" height="52" rx="4" fill="#374151" stroke="#1F2937" stroke-width="2"/>
      <rect x="0" y="-10" width="76" height="12" rx="2" fill="#4B5563"/>
    </g>
    <g transform="translate(880,0)">
      <rect x="0" y="0" width="76" height="52" rx="4" fill="#4B5563" stroke="#1F2937" stroke-width="2"/>
      <rect x="0" y="-10" width="76" height="12" rx="2" fill="#6B7280"/>
    </g>
    <g transform="translate(960,0)">
      <rect x="0" y="0" width="76" height="52" rx="4" fill="#374151" stroke="#1F2937" stroke-width="2"/>
      <rect x="0" y="-10" width="76" height="12" rx="2" fill="#4B5563"/>
    </g>
  </g>

  <!-- 檢查點 2 旗幟 (已啟用綠色, x=16 -> 358) -->
  <g transform="translate(350, 355)">
    <rect x="0" y="0" width="8" height="115" fill="#D1D5DB"/>
    <rect x="8" y="6" width="44" height="28" rx="3" fill="#10B981"/>
    <text x="30" y="25" text-anchor="middle" fill="#064E3B" class="mono" font-size="12" font-weight="700">CP2</text>
  </g>

  <!-- 巡邏電鋸 (Saw-1) -->
  <g transform="translate(175, 385)">
    <rect x="-32" y="-32" width="64" height="64" rx="8" fill="#EF4444" stroke="#FCA5A5" stroke-width="3" transform="rotate(22)"/>
    <rect x="-24" y="-24" width="48" height="48" rx="6" fill="#B91C1C" transform="rotate(67)"/>
    <circle cx="0" cy="0" r="10" fill="#FDE047"/>
    <text x="0" y="-48" text-anchor="middle" fill="#FCA5A5" class="mono" font-size="12">電鋸 (週期 2.0s)</text>
  </g>

  <!-- 樹懶主角 (位於 x=18 缺口前蓄力大步，帶 ×1.4 碰撞盒綠框) -->
  <g transform="translate(518, 418)">
    <!-- ×1.4 動態水平碰撞盒外框 -->
    <rect x="-56" y="-40" width="112" height="92" fill="rgba(52,211,153,0.10)" stroke="#34D399" stroke-width="2.5" stroke-dasharray="5 3"/>
    <text x="0" y="-48" text-anchor="middle" fill="#34D399" class="mono" font-size="12" font-weight="700">碰撞盒 ×1.4 (大步 3 格)</text>
    <!-- 體素樹懶軀幹与頭 -->
    <rect x="-24" y="-2" width="48" height="52" rx="6" fill="#8B6B4E" stroke="#5C4033" stroke-width="2"/>
    <rect x="-14" y="-32" width="40" height="34" rx="6" fill="#9C7A5B" stroke="#5C4033" stroke-width="2"/>
    <rect x="10" y="-26" width="18" height="24" rx="4" fill="#E6CCB2"/>
    <rect x="20" y="-20" width="5" height="7" fill="#1E1A17"/>
    <!-- 預判落點箭頭 (x=18 -> x=21) -->
    <path d="M 35 15 Q 130 -65 235 15" fill="none" stroke="#FBBF24" stroke-width="3" stroke-dasharray="8 5"/>
    <polygon points="235,15 223,8 226,22" fill="#FBBF24"/>
  </g>

  <!-- 短週期落石 (Rock-2, x=23 -> 918) -->
  <g transform="translate(918, 250)">
    <rect x="-30" y="-30" width="60" height="60" rx="6" fill="#D97706" stroke="#FDE68A" stroke-width="2.5"/>
    <rect x="-18" y="-18" width="36" height="36" fill="#B45309"/>
    <path d="M 0 38 L 0 190" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="6 6"/>
    <text x="0" y="-40" text-anchor="middle" fill="#FCD34D" class="mono" font-size="12">落石 (週期 1.5s)</text>
  </g>

  <!-- 終點拱門 (Goal, x=25 -> 1078) -->
  <g transform="translate(1050, 310)">
    <rect x="0" y="0" width="16" height="160" fill="#10B981"/>
    <rect x="52" y="0" width="16" height="160" fill="#10B981"/>
    <rect x="-6" y="-18" width="80" height="24" rx="4" fill="#34D399"/>
    <text x="34" y="-2" text-anchor="middle" fill="#064E3B" class="mono" font-size="13" font-weight="700">GOAL</text>
  </g>

  <!-- 頂部 HUD -->
  <g transform="translate(24, 20)">
    <text x="0" y="24" fill="#FBBF24" class="mono" font-size="22" font-weight="700">SLO-MO: 慢速極限</text>
    <text x="0" y="46" fill="#CBD5E1" class="mono" font-size="13">The Incredibly Slow Survival · 【老馬麵攤製作】</text>
    <text x="0" y="68" fill="#94A3B8" class="mono" font-size="13">[←/→ 或 A/D] 長按蓄力放開出步 ｜ [Space/S] 聲納凍結預覽</text>
  </g>

  <!-- 右上計分面板 -->
  <g transform="translate(1010, 20)">
    <rect x="0" y="0" width="246" height="92" rx="8" fill="rgba(17,24,39,0.88)" stroke="#374151" stroke-width="1.5"/>
    <text x="16" y="28" fill="#F3F4F6" class="mono" font-size="15">步數：<tspan font-weight="700" fill="#34D399">7</tspan></text>
    <text x="16" y="52" fill="#F3F4F6" class="mono" font-size="15">世界時間：<tspan font-weight="700" fill="#60A5FA">28.4s</tspan> / 600.0s</text>
    <text x="16" y="76" fill="#F3F4F6" class="mono" font-size="15">死亡次數：<tspan font-weight="700" fill="#F87171">0</tspan></text>
  </g>

  <!-- 底部蓄力條與聲納冷卻面板 -->
  <g transform="translate(24, 628)">
    <rect x="0" y="0" width="930" height="68" rx="8" fill="rgba(17,24,39,0.88)" stroke="#374151" stroke-width="1.5"/>
    <text x="16" y="26" fill="#F3F4F6" class="mono" font-size="14" font-weight="700">蓄力：大步 3 格 / ×1.4 (2.25s) — 放開即可跨過 2 格缺口</text>
    <rect x="16" y="38" width="898" height="14" rx="7" fill="#1F2937"/>
    <rect x="16" y="38" width="898" height="14" rx="7" fill="#EF4444"/>

    <rect x="946" y="0" width="286" height="68" rx="8" fill="rgba(17,24,39,0.88)" stroke="#374151" stroke-width="1.5"/>
    <text x="962" y="26" fill="#F3F4F6" class="mono" font-size="14">聲納就緒 [Space / S]（凍結 3s）</text>
    <rect x="962" y="38" width="254" height="14" rx="7" fill="#A78BFA"/>
  </g>
</svg>
